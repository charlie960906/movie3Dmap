        }

        .stall-box {
            transition: all 0.15s ease;

        }
        .stall-box:hover {
            filter: brightness(1.15);
            transform: translateY(-1px);
        }
        /* Glass panel CSS utility */
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);

            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .glass-modal {
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
            .svg-hit { cursor: pointer; transition: filter .15s; }
        .svg-hit:hover { filter: brightness(1.15); }
            html, body { overscroll-behavior: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }

        @media (min-width: 768px) {
            #info-modal-backdrop { background: transparent !important; -webkit-backdrop-filter: none !important; backdrop-filter: none !important; opacity: 1 !important; pointer-events: none !important; padding: 0 !important; }

        @media (min-width: 768px) and (max-width: 1023px) {
            #info-modal { top: 9rem; max-height: calc(100dvh - 10rem) !important; }

        @media (max-width: 767px) {
            #info-modal { transition: transform .45s cubic-bezier(.22, 1.15, .36, 1); }

        // --- Shared layout (single source of truth for 3D scene AND 2D plan; x right, z down in top view) ---
        const LAYOUT = (() => {
            const stalls = [];
            for (let i = 1; i <= 8; i++) stalls.push({ id: i, x: -17, z: -10.5 + (i - 1) * 3.1 });
            for (let i = 9; i <= 22; i++) stalls.push({ id: i, x: -13.5 + (i - 9) * 2.25, z: 12, rot: true });
            const stage = { x: 0, z: 1, w: 8, d: 5 };

            const tents = [{ key: 'left', x: -11, z: -10.5 }, { key: 'right', x: 11, z: -10.5 }];
            tents.forEach(t => { t.ry = Math.atan2(stage.x - t.x, stage.z - t.z); });
            return {
                stalls, stage, tents,
                movie: { x: 0, z: -11, w: 11.6, d: 0.6 },
                boothX: 17,

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 32, 38);

            const isMobile = window.innerWidth < 768;
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.75 : 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputEncoding = THREE.sRGBEncoding;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.07;
            controls.maxPolarAngle = Math.PI / 2 - 0.05;
            controls.minDistance = 8;
            controls.maxDistance = 75;
            controls.target.set(0, 0, 2);
            controls.rotateSpeed = IS_TOUCH ? 0.7 : 1;
            controls.screenSpacePanning = true;
            if (THREE.TOUCH) controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };

            raycaster.params.Line.threshold = 0.5;

            setupLights();
            buildExhibitionMap();

            window.addEventListener('resize', onWindowResize);

            // Unified pointer handling: a tap = one finger/mouse, short, little movement (drag/pinch never selects)
            let tap = null;
            container.addEventListener('pointerdown', (e) => {
                // second finger (pinch/rotate) is never a tap; a fresh primary pointer always starts a new one
                tap = e.isPrimary ? { x: e.clientX, y: e.clientY, t: performance.now(), touch: e.pointerType !== 'mouse' } : null;
            });
            container.addEventListener('pointermove', (e) => {
                if (tap && Math.hypot(e.clientX - tap.x, e.clientY - tap.y) > (tap.touch ? 14 : 6)) tap = null;
                if (e.pointerType === 'mouse') onMouseMove(e);
            });
            container.addEventListener('pointerup', (e) => {
                if (e.isPrimary && tap && performance.now() - tap.t < 900) handlePointerSelection(e.clientX, e.clientY, tap.touch);
                tap = null;
            });
            container.addEventListener('pointercancel', () => { tap = null; });
            window.addEventListener('orientationchange', () => setTimeout(onWindowResize, 250));

            setupUI();
            animate();
        }

        // --- Create Floating Sprite Labels (Camera Following) ---
        function createFloatingLabel(text, x, y, z, bgColor = "#0ea5e9", textColor = "#ffffff", sw = 3.6, sh = 1.3) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 90;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = bgColor;
            ctx.beginPath();
            ctx.roundRect(8, 8, canvas.width - 16, canvas.height - 16, 20);
            ctx.fill();

            ctx.lineWidth = 4;
            ctx.strokeStyle = "rgba(255,255,255,0.7)";
            ctx.stroke();

            ctx.fillStyle = textColor;
            ctx.font = 'bold 34px Inter, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture, depthTest: false, depthWrite: false });
            const sprite = new THREE.Sprite(spriteMaterial);

            sprite.position.set(x, y, z);
            sprite.scale.set(sw, sh, 1);
            sprite.renderOrder = 999; // Always render on top

            scene.add(sprite);
            billboardSprites.push(sprite);
            return sprite;
        }

        // One tent = two identical halves (A | B) split by a centre wall, whole tent angled toward the stage
        function createConceptTent(tent) {
            const tentGroup = new THREE.Group();
            tentGroup.position.set(tent.x, 0, tent.z);
            tentGroup.rotation.y = tent.ry;
            const W = TENT_HALF.w, D = TENT_HALF.d;
            const glassMat = new THREE.MeshPhysicalMaterial({ color: PALETTE.glass, transparent: true, opacity: 0.55, transmission: 0.85, roughness: 0.1 });
            const roofMat = new THREE.MeshStandardMaterial({ color: 0x0284c7 });
            const halves = [], hitList = [];

            [['a', -W / 2, '概念 A區'], ['b', W / 2, '概念 B區']].forEach(([k, lx, label]) => {
                const half = new THREE.Group();
                half.position.set(lx, 0, 0);
                half.userData.viewDir = new THREE.Vector3(Math.sin(tent.ry), 0, Math.cos(tent.ry));   // tent front faces the stage

                const roof = new THREE.Mesh(new THREE.BoxGeometry(W, 0.35, D), roofMat);
                roof.position.y = 2.8; roof.castShadow = true; half.add(roof);
                const walls = new THREE.Mesh(new THREE.BoxGeometry(W - 0.2, 2.4, D - 0.2), glassMat);
                walls.position.y = 1.3; half.add(walls);

                const pedestal = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.6, 0.9, 16), new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.3 }));
                pedestal.position.set(0, 0.45, 0); half.add(pedestal);
                const artifact = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), new THREE.MeshStandardMaterial({ color: 0xf59e0b, metalness: 0.8, roughness: 0.2 }));
                artifact.position.set(0, 1.1, 0); half.add(artifact);

                const zoneInfo = ZONE_DATA[`concept_${tent.key}_${k}`];
                const hitMesh = new THREE.Mesh(new THREE.BoxGeometry(W, 3.5, D), new THREE.MeshBasicMaterial({ visible: false }));
                hitMesh.position.y = 1.75;
                hitMesh.userData = { type: 'zone', title: zoneInfo.name, data: zoneInfo, meshGroup: half };
                half.add(hitMesh);
                interactiveObjects.push(hitMesh);
                hitList.push(hitMesh);
                tentGroup.add(half);
                halves.push([half, label]);
            });

            // Centre dividing wall between A and B
            const divider = new THREE.Mesh(new THREE.BoxGeometry(0.2, 2.6, D - 0.1), new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.4 }));
            divider.position.set(0, 1.3, 0);
            divider.castShadow = true;
            tentGroup.add(divider);
            tentDividers.push({ mesh: divider, hits: hitList });

            scene.add(tentGroup);
            tentGroup.updateMatrixWorld(true);
            halves.forEach(([half, label]) => {
                const p = new THREE.Vector3();
                half.getWorldPosition(p);
                createFloatingLabel(label, p.x, 4.6, p.z, "#0284c7", "#ffffff", 3.2, 1.15);
            });
        }

        // --- 2D / 3D Mode Switcher: the same 3D layer is flattened and viewed straight from above ---
        const VIEW_2D = { x: 0, y: 46, z: 0.01 };
        const flat = { k: 1 };
        const spriteBaseY = new Map();

        function applyFlatten(k) {
            flat.k = k;
            scene.children.forEach(o => { if (o.isGroup) o.scale.y = k; });
            billboardSprites.forEach(s => {
                if (!spriteBaseY.has(s)) spriteBaseY.set(s, s.position.y);
                s.position.y = Math.max(0.6, spriteBaseY.get(s) * k);
            });
        }

        function toggle2D3DView() {
            is2DMode = !is2DMode;
            document.getElementById('view-mode-text').innerText = is2DMode ? "切換 3D" : "切換 2D";
            document.getElementById('view-mode-icon').className = is2DMode ? "fa-solid fa-cube text-sm" : "fa-solid fa-layer-group text-sm";
            controls.enableRotate = !is2DMode;
            if (THREE.TOUCH) controls.touches.ONE = is2DMode ? THREE.TOUCH.PAN : THREE.TOUCH.ROTATE;
            controls.mouseButtons.LEFT = is2DMode ? THREE.MOUSE.PAN : THREE.MOUSE.ROTATE;
            new TWEEN.Tween({ k: flat.k })
                .to({ k: is2DMode ? 0.04 : 1 }, 800)
                .easing(TWEEN.Easing.Cubic.InOut)
                .onUpdate(o => applyFlatten(o.k))
                .start();
            resetCameraView();
        }

        function trigger2DNode(key) {
            if (key === 'movie') {
                openModal({ type: 'movie', title: MOVIE_DATA.title, data: MOVIE_DATA });
            } else if (key === 'stage') {
                openModal({ type: 'stage', title: STAGE_DATA.title, data: STAGE_DATA });
            } else if (ZONE_DATA[key]) {

                openModal({ type: 'zone', title: zone.name, data: zone });
            }
        }

        // --- Pointer Interaction & Camera Helpers ---
        function handlePointerSelection(clientX, clientY, touch) {
            // Touch: also probe a few points around the fingertip so small stalls are easy to hit
            const offs = touch ? [[0, 0], [16, 0], [-16, 0], [0, 16], [0, -16]] : [[0, 0]];
            for (const [dx, dy] of offs) {
                mouse.x = ((clientX + dx) / window.innerWidth) * 2 - 1;
                mouse.y = -((clientY + dy) / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const hits = raycaster.intersectObjects(pickables(), false);
                if (hits.length > 0) {
                    if (navigator.vibrate) navigator.vibrate(15);
                    focusCameraOnObject(hits[0].object.userData.meshGroup);
                    openModal(hits[0].object.userData);
                    return;
                }
            }
            closeModal();
        }

        function focusCameraOnObject(meshGroup) {
            const targetPos = new THREE.Vector3();
            meshGroup.getWorldPosition(targetPos);

            const dir = meshGroup.userData.viewDir || new THREE.Vector3(0, 0, 1);   // side of the object to look at
            const cameraOffset = is2DMode ? new THREE.Vector3(0, 24, 0.01) : new THREE.Vector3(dir.x * 17, 14, dir.z * 17);
            const newCamPos = targetPos.clone().add(cameraOffset);

            new TWEEN.Tween(camera.position)
                .to(newCamPos, 800)
                .easing(TWEEN.Easing.Cubic.Out)
                .start();

            new TWEEN.Tween(controls.target)
                .to(targetPos, 800)
                .easing(TWEEN.Easing.Cubic.Out)
                .onUpdate(() => controls.update())
                .start();
        }

        function resetCameraView() {
            new TWEEN.Tween(camera.position)
                .to(is2DMode ? VIEW_2D : { x: 0, y: 32, z: 38 }, 900)
                .easing(TWEEN.Easing.Cubic.Out)
                .start();

            new TWEEN.Tween(controls.target)
                .to(is2DMode ? { x: 0, y: 0, z: 0 } : { x: 0, y: 0, z: 2 }, 900)
                .easing(TWEEN.Easing.Cubic.Out)
                .onUpdate(() => controls.update())
                .start();
        }

        // --- Modal Popups ---
        function openModal(data) {
            const backdrop = document.getElementById('info-modal-backdrop');
            const modal = document.getElementById('info-modal');
            const titleEl = document.getElementById('modal-title');
            const catEl = document.getElementById('modal-category');
            const bodyEl = document.getElementById('modal-body');
            const iconEl = document.getElementById('modal-badge-icon');

            titleEl.innerText = data.title;

            if (data.type === 'market') {
                catEl.innerText = `市集攤位 #${data.id} • ${data.data.category}`;
                iconEl.innerHTML = `<i class="fa-solid fa-store"></i>`;
                bodyEl.innerHTML = `
                    <div class="bg-slate-800/70 p-3.5 rounded-2xl border border-slate-700/60 space-y-2.5">
                        <div class="flex justify-between items-center">
                            <span class="text-xs text-slate-400">品牌 / 賣家</span>
                            <span class="font-semibold text-emerald-400 text-xs md:text-sm">${data.data.owner}</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-xs text-slate-400">商品單價</span>
                            <span class="font-medium text-amber-400 text-xs md:text-sm">${data.data.price}</span>
                        </div>
                    </div>
                    <div>
                        <h4 class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">主要販售內容</h4>
                        <p class="bg-slate-900/80 p-3 rounded-xl border border-slate-800 text-slate-200 leading-relaxed">${data.data.items}</p>
                    </div>
                `;
            } else if (data.type === 'stage') {
                catEl.innerText = '表演節目表';
                iconEl.innerHTML = `<i class="fa-solid fa-music"></i>`;
                let scheduleHTML = data.data.schedule.map(item => `
                    <div class="flex items-center justify-between p-3 bg-slate-800/60 rounded-xl border border-slate-700/50">
                        <div>
                            <span class="text-[11px] text-purple-400 font-mono font-semibold block">${item.time}</span>
                            <h5 class="text-xs md:text-sm font-bold text-white mt-0.5">${item.event}</h5>
                        </div>
                        <span class="text-[10px] md:text-xs bg-purple-500/20 text-purple-300 px-2 py-1 rounded-lg border border-purple-500/30 shrink-0 ml-2">${item.performer}</span>
                    </div>
                `).join('');

                bodyEl.innerHTML = `<p class="text-xs text-slate-300 mb-2">${data.data.desc}</p><div class="space-y-2">${scheduleHTML}</div>`;
            } else if (data.type === 'movie') {
                catEl.innerText = '電影放映節目';
                iconEl.innerHTML = `<i class="fa-solid fa-film"></i>`;
                let moviesHTML = data.data.todayMovies.map(m => `
                    <div class="p-3 bg-slate-800/60 rounded-2xl border border-slate-700/60 space-y-1.5">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="text-[11px] text-blue-400 font-mono font-semibold">${m.time} (${m.duration})</span>
                                <h4 class="text-xs md:text-sm font-bold text-white mt-0.5">${m.name}</h4>
                            </div>
                            <span class="text-[10px] bg-blue-500/20 text-blue-300 px-2 py-0.5 rounded border border-blue-500/30 shrink-0 ml-2">${m.tag}</span>
                        </div>
                        <p class="text-[11px] text-slate-300 leading-relaxed">${m.desc}</p>
                    </div>
                `).join('');

                bodyEl.innerHTML = `<p class="text-xs text-slate-300 mb-2">${data.data.desc}</p><div class="space-y-2.5">${moviesHTML}</div>`;
            } else if (data.type === 'zone') {
                catEl.innerText = data.data.cat || '展區介紹';
                iconEl.innerHTML = `<i class="fa-solid fa-compass"></i>`;
                bodyEl.innerHTML = `
                    <div class="bg-slate-800/60 p-3.5 rounded-2xl border border-slate-700/60">
                        <p class="text-xs md:text-sm text-slate-200 leading-relaxed">${data.data.desc}</p>
                    </div>
                `;
            }

            backdrop.classList.remove('opacity-0', 'pointer-events-none');
            modal.classList.add('is-open');
            setPanelShift(true);
            modal.classList.remove('translate-y-full', 'scale-95');
            modal.classList.add('translate-y-0', 'scale-100');
        }

// Shift the 3D view (right on desktop/tablet, up on phone) so the focused object isn't hidden behind the panel/sheet
        const viewShift = { v: 0, y: 0 };
        function setPanelShift(open) {
            const wide = window.matchMedia('(min-width: 768px)').matches;
            const sheetH = Math.min(document.getElementById('info-modal').offsetHeight, window.innerHeight * 0.8);
            new TWEEN.Tween(viewShift)
                .to({ v: open && wide ? Math.min(384, window.innerWidth - 32) / 2 + 8 : 0, y: open && !wide ? sheetH / 2 : 0 }, 600)
                .easing(TWEEN.Easing.Cubic.Out).start();
        }

        function closeModal() {
            const backdrop = document.getElementById('info-modal-backdrop');
            const modal = document.getElementById('info-modal');
            backdrop.classList.add('opacity-0', 'pointer-events-none');
            modal.classList.remove('is-open');
            setPanelShift(false);
            modal.classList.remove('translate-y-0', 'scale-100');
            modal.classList.add('translate-y-full', 'scale-95');
        }

        // --- Search & category filter (dims non-matching objects in 3D / 2D, lists matches, jumps to selection) ---
        const tentDividers = [];   // centre walls: lit only while at least one half of the tent is lit
        const filterState = { cat: 'all', q: '' };
        const CAT_OF = { market: 'market', stage: 'stage', movie: 'movie', zone: 'exhibition' };
        const norm = s => String(s == null ? '' : s).toLowerCase().replace(/\s+/g, '');
        const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        const pickables = () => interactiveObjects.filter(o => !o.userData.dimmed);

        function entrySearchText(ud) {
            const d = ud.data || {};
            if (ud.type === 'market') return norm([ud.title, d.name, d.owner, d.category, d.items, '攤位' + ud.id].join(' '));
            if (ud.type === 'stage') return norm([ud.title, d.desc, ...d.schedule.map(s => s.performer + s.event)].join(' '));
            if (ud.type === 'movie') return norm([ud.title, d.desc, ...d.todayMovies.map(m => m.name + m.tag)].join(' '));
            return norm([ud.title, ud.title.replace('展覽', ''), d.name, d.cat, d.desc].join(' '));
        }

        function entryMatches(ud) {
            if (filterState.cat !== 'all' && CAT_OF[ud.type] !== filterState.cat) return false;
            const q = norm(filterState.q);
            if (!q) return true;
            const m = q.match(/^(?:攤位|#|no\.?)?(\d+)$/);
            if (m) return ud.type === 'market' && String(ud.id).startsWith(m[1]);
            if (ud._text === undefined) ud._text = entrySearchText(ud);
            return ud._text.includes(q);
        }

        function setGroupDim(group, dim) {
            group.traverse(o => {
                if (!o.isMesh || o.userData.type) return;   // skip invisible hit boxes
                if (!o.userData._m) {
                    o.userData._m = o.material;
                    o.userData._d = o.material.clone();
                    o.userData._d.transparent = true;
                    o.userData._d.opacity = 0.1;
                    o.userData._d.depthWrite = false;
                }
                o.material = dim ? o.userData._d : o.userData._m;
            });
        }

        function applyFilters() {
            scene.updateMatrixWorld(true);
            interactiveObjects.forEach(o => {
                const dim = !entryMatches(o.userData);
                o.userData.dimmed = dim;
                setGroupDim(o.userData.meshGroup, dim);
            });
            tentDividers.forEach(t => setGroupDim(t.mesh, t.hits.every(o => o.userData.dimmed)));
            const wp = new THREE.Vector3();
            billboardSprites.forEach(sp => {
                if (!sp.userData.owner) {   // label belongs to the nearest interactive object
                    let best = null, bd = Infinity;
                    interactiveObjects.forEach(o => {
                        o.userData.meshGroup.getWorldPosition(wp);
                        const d = Math.hypot(wp.x - sp.position.x, wp.z - sp.position.z);
                        if (d < bd) { bd = d; best = o; }
                    });
                    sp.userData.owner = best;
                }
                sp.material.opacity = sp.userData.owner.userData.dimmed ? 0.1 : 1;
            });
        }

        function renderSearchResults() {
            const box = document.getElementById('search-results');
            if (!norm(filterState.q)) { box.classList.add('hidden'); box._items = []; return; }
            const list = interactiveObjects.map(o => o.userData).filter(entryMatches);
            const shown = list.slice(0, 8);
            box._items = shown;
            const sub = ud => ud.type === 'market' ? ud.data.category : ud.type === 'stage' ? '表演' : ud.type === 'movie' ? '電影放映' : (ud.data.cat || '展區');
            box.innerHTML = list.length
                ? `<div class="px-3 py-1.5 text-[11px] text-slate-400">找到 ${list.length} 項${list.length > shown.length ? '（顯示前 8 項）' : ''}</div>` +
                  shown.map((ud, i) => `<button data-i="${i}" class="w-full text-left px-3 py-2.5 min-h-[44px] hover:bg-slate-800 active:bg-slate-700 flex items-center justify-between gap-2"><span class="text-xs font-semibold text-white truncate">${esc(ud.title)}</span><span class="text-[10px] text-slate-400 shrink-0">${esc(sub(ud))}</span></button>`).join('')
                : `<div class="px-3 py-3 text-xs text-slate-400">找不到符合「${esc(filterState.q)}」的項目</div>`;
            box.classList.remove('hidden');
        }

        function selectEntry(ud) {
            if (!ud) return;
            document.getElementById('search-results').classList.add('hidden');
            document.getElementById('search-input').blur();
            focusCameraOnObject(ud.meshGroup);
            openModal(ud);
        }

        function initSearchFilter() {
            const input = document.getElementById('search-input'), box = document.getElementById('search-results');
            const refresh = () => { filterState.q = input.value; applyFilters(); renderSearchResults(); };
            input.addEventListener('input', refresh);
            input.addEventListener('focus', renderSearchResults);
            input.addEventListener('keydown', e => {
                if (e.key === 'Enter') { e.preventDefault(); selectEntry((box._items || [])[0]); }
                else if (e.key === 'Escape') { input.value = ''; refresh(); input.blur(); }
            });
            box.addEventListener('click', e => {
                const b = e.target.closest('button[data-i]');
                if (b) selectEntry(box._items[+b.dataset.i]);
            });
            document.addEventListener('pointerdown', e => {
                if (!e.target.closest('#search-results') && e.target.id !== 'search-input') box.classList.add('hidden');
            });
            const btns = document.querySelectorAll('.filter-btn');
            btns.forEach(btn => btn.addEventListener('click', () => {
                filterState.cat = btn.dataset.category;
                btns.forEach(b => {
                    const on = b === btn;
                    b.classList.toggle('bg-blue-600', on); b.classList.toggle('text-white', on);
                    b.classList.toggle('bg-slate-800/90', !on); b.classList.toggle('text-slate-300', !on);
                });
                applyFilters(); renderSearchResults();
            }));
        }

        function setupUI() {
            initSearchFilter();
            document.getElementById('view-mode-btn').addEventListener('click', toggle2D3DView);
            document.getElementById('close-modal-btn').addEventListener('click', closeModal);
            const sheet = document.getElementById('info-modal'), handle = document.getElementById('sheet-handle');
            let sheetY = null;
            handle.addEventListener('touchstart', (e) => { sheetY = e.touches[0].clientY; sheet.style.transition = 'none'; }, { passive: true });
            handle.addEventListener('touchmove', (e) => {
                if (sheetY !== null) sheet.style.transform = `translateY(${Math.max(0, e.touches[0].clientY - sheetY)}px)`;
            }, { passive: true });
            handle.addEventListener('touchend', (e) => {
                if (sheetY === null) return;
                const dy = e.changedTouches[0].clientY - sheetY;
                sheetY = null; sheet.style.transition = ''; sheet.style.transform = '';
                if (dy > 80) closeModal();
            }, { passive: true });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
            document.getElementById('info-modal-backdrop').addEventListener('click', (e) => {
                if (e.target.id === 'info-modal-backdrop') closeModal();
            });

            document.getElementById('btn-zoom-in').addEventListener('click', () => zoomCamera(-8));
            document.getElementById('btn-zoom-out').addEventListener('click', () => zoomCamera(8));
            document.getElementById('btn-reset-cam').addEventListener('click', resetCameraView);

            document.getElementById('toggle-search-btn').addEventListener('click', () => {
                const panel = document.getElementById('controls-panel');
                panel.classList.toggle('hidden');
                panel.classList.toggle('flex');
                if (!panel.classList.contains('hidden')) document.getElementById('search-input').focus();
            });
        }

        function trigger2DStall(id) {
            const item = MARKET_DATA[id];
            if (item) {
                openModal({
                    type: 'market',
                    id: id,
                    title: `攤位 ${id} - ${item.name}`,
                    data: item
                });
            }
        }

        function zoomCamera(delta) {
            const dir = new THREE.Vector3().subVectors(camera.position, controls.target).normalize();
            const targetPos = camera.position.clone().addScaledVector(dir, delta);
            new TWEEN.Tween(camera.position)
                .to(targetPos, 400)
                .easing(TWEEN.Easing.Cubic.Out)
                .start();
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(pickables(), false);

            const tooltip = document.getElementById('tooltip');
            const tooltipText = document.getElementById('tooltip-text');

            if (intersects.length > 0 && window.innerWidth >= 768) {
                const hitObj = intersects[0].object;
                tooltip.style.top = (document.querySelector('header').getBoundingClientRect().bottom + 10) + 'px';
                tooltipText.innerText = hitObj.userData.title;
                tooltip.style.display = 'flex';
            } else {
                tooltip.style.display = 'none';
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            TWEEN.update();
            if (viewShift.v > 0.5 || viewShift.y > 0.5) camera.setViewOffset(window.innerWidth, window.innerHeight, -viewShift.v, viewShift.y, window.innerWidth, window.innerHeight);
            else if (camera.view && camera.view.enabled) camera.clearViewOffset();
            controls.update();
            const tg = controls.target, cx = THREE.MathUtils.clamp(tg.x, -26, 26), cz = THREE.MathUtils.clamp(tg.z, -20, 20);
            if (cx !== tg.x || cz !== tg.z) { camera.position.x += cx - tg.x; camera.position.z += cz - tg.z; tg.x = cx; tg.z = cz; }

            // Always orient billboard labels towards the camera view
            billboardSprites.forEach(sprite => {
                sprite.quaternion.copy(camera.quaternion);
            });

            renderer.render(scene, camera);
        }

        window.onload = function() {
            init();
        };
    </script>
</body>
</html>
